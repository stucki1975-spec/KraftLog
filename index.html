<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>KraftLog 2.0</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:760px;margin:auto;padding:22px 16px 110px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-size:27px;font-weight:850;letter-spacing:-1px}.brand span{color:#3568ee}.muted{color:#748097}.tiny{font-size:12px}.card{background:white;border:1px solid #e8edf5;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 3px 18px #243b6810}.hero{background:linear-gradient(115deg,#e9f0ff,#fff);padding:22px}.hero h2{margin:8px 0;font-size:26px;letter-spacing:-.7px}h2{font-size:23px;margin:0 0 14px}h3{font-size:17px;margin:0 0 12px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:#3568ee}.btn{border:0;border-radius:12px;background:#3568ee;color:white;padding:12px 15px;font-weight:750;min-height:44px}.btn.secondary{background:#edf2ff;color:#2857d3}.btn.ghost{background:#f2f5fa;color:#45516a}.btn.danger{background:#fff0f1;color:#c32d47}.btn.small{padding:8px 10px;min-height:34px;font-size:13px}.btn.full{width:100%}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:15px;border-radius:15px;background:#f6f8fc}.stat b{display:block;font-size:24px;margin:4px 0}.label{display:block;font-size:13px;font-weight:700;color:#56637b;margin:10px 0 6px}input,select{width:100%;border:1px solid #dbe3ef;border-radius:12px;padding:12px;background:#fff;color:#172033;min-height:44px}input[type=number]{min-width:0}input:focus,select:focus{outline:2px solid #abc2ff}.line{height:1px;background:#edf0f5;margin:14px 0}.exercise{padding:13px 0;border-bottom:1px solid #edf0f5}.exercise:last-child{border:0}.exercise strong{display:block}.pill{font-size:12px;border-radius:100px;padding:5px 9px;background:#eef3ff;color:#315dcc;font-weight:700}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(16px);border-top:1px solid #e8edf5;display:flex;justify-content:center;padding:9px max(8px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));z-index:5}.navwrap{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav{border:0;background:transparent;color:#8792a6;padding:7px 1px;border-radius:12px;font-size:11px;font-weight:750}.nav span{display:block;font-size:20px;margin-bottom:3px}.nav.active{color:#315fd8;background:#edf2ff}.empty{text-align:center;padding:30px 14px;color:#7b8699}.setrow{display:grid;grid-template-columns:30px 1fr 1fr 40px;gap:7px;align-items:center;margin:7px 0}.setrow input{text-align:center;padding:9px 4px}.check{height:38px;width:38px;border:1px solid #dbe3ef;background:#fff;border-radius:10px;font-size:18px}.check.done{background:#e2f8ea;border-color:#9ad7ae;color:#177b3b}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{aspect-ratio:1;border:0;border-radius:12px;background:#f6f8fc;color:#27364e;position:relative;font-weight:650}.day.training:after{content:"";position:absolute;bottom:5px;left:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:#3568ee}.day.selected{background:#3568ee;color:white}.day.selected:after{background:white}.day.out{opacity:.3}.weekday{text-align:center;color:#8c97a8;font-size:12px;padding:7px 0}.timer{font-size:64px;letter-spacing:-2px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;padding:20px 0}.chart{width:100%;height:auto;display:block}.notice{padding:11px;border-radius:12px;background:#fff7e7;color:#8b5d13;font-size:13px;margin:12px 0}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#172033;color:white;border-radius:12px;padding:12px 18px;z-index:20;box-shadow:0 8px 25px #0003}.hidden{display:none!important}@media(min-width:620px){.shell{padding-top:34px}.hero h2{font-size:32px}}@media(max-width:380px){.btn{padding:10px}.card{padding:14px}.nav{font-size:10px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">Kraft<span>Log</span><span class="muted tiny" style="font-weight:500;margin-left:7px">2.0</span></div><button class="btn ghost small" id="backupBtn">Daten ↗</button></header><div id="app"></div></main><nav class="bottom"><div class="navwrap" id="nav"></div></nav><input type="file" id="importFile" accept="application/json,.json" hidden><script>
'use strict';
const KEY='kraftlog_v2', OLD='kraftlog_v1';
const uid=()=>crypto?.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2);
const today=()=>localDate(new Date());const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateLabel=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'});
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const starter={plans:[{id:'demo',name:'Ganzkörper A',exercises:[{id:'e1',name:'Kniebeugen',sets:3,reps:8},{id:'e2',name:'Bankdrücken',sets:3,reps:10},{id:'e3',name:'Rudern',sets:3,reps:10}]}],sessions:[]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(starter)}catch{db=structuredClone(starter)};
function valid(x){return x&&Array.isArray(x.plans)&&Array.isArray(x.sessions)&&x.plans.every(p=>typeof p.name==='string'&&Array.isArray(p.exercises))}
if(!valid(db))db=structuredClone(starter);
let tab='home',active=null,editPlan=null,selectedDay=today(),month=new Date().getMonth(),year=new Date().getFullYear(),progressExercise='',timerRemaining=90,timerRunning=false,timerUntil=0,timerHandle=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Speicher ist voll oder deaktiviert. Bitte Daten exportieren.')}}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2100)}
function navTo(t){tab=t;editPlan=null;render()}
function render(){document.getElementById('nav').innerHTML=[['home','⌂','Start'],['plans','▤','Pläne'],['train','◉','Training'],['progress','▥','Fortschritt'],['calendar','▦','Kalender']].map(([id,ic,txt])=>`<button class="nav ${tab===id?'active':''}" data-tab="${id}"><span>${ic}</span>${txt}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navTo(b.dataset.tab));document.getElementById('app').innerHTML=({home:homeView,plans:plansView,train:trainView,progress:progressView,calendar:calendarView})[tab]();bind()}
function homeView(){const total=db.sessions.length,last=db.sessions.at(-1);return `<section class="card hero"><div class="eyebrow">Dein Training. Dein Plan.</div><h2>Heute stärker werden.</h2><p class="muted">Trainiere nach deinem eigenen System und halte deine Fortschritte fest.</p><button class="btn" data-go="train">Training starten →</button></section><div class="grid2"><div class="stat"><span class="muted tiny">Trainingseinheiten</span><b>${total}</b></div><div class="stat"><span class="muted tiny">Trainingspläne</span><b>${db.plans.length}</b></div></div><div class="card" style="margin-top:14px"><h3>Letztes Training</h3>${last?`<b>${safe(last.planName)}</b><p class="muted">${dateLabel(last.date)} · ${last.exercises.length} Übungen</p><button class="btn secondary small" data-go="calendar">Im Kalender ansehen</button>`:'<p class="muted">Noch kein Training gespeichert. Starte deine erste Einheit!</p>'}</div><div class="card"><h3>Dein nächster Schritt</h3><p class="muted">Erstelle einen individuellen Trainingsplan oder passe den Beispielplan an.</p><button class="btn secondary" data-go="plans">Trainingspläne öffnen</button></div>`}
function plansView(){if(editPlan!==null)return editView();return `<div class="row between"><h2>Trainingspläne</h2><button class="btn small" id="newPlan">+ Neuer Plan</button></div>${db.plans.length?db.plans.map(p=>`<div class="card"><div class="row between"><div><h3>${safe(p.name)}</h3><span class="muted tiny">${p.exercises.length} Übungen</span></div><button class="btn secondary small" data-edit="${safe(p.id)}">Bearbeiten</button></div><div class="line"></div>${p.exercises.map(e=>`<div class="row between" style="margin:8px 0"><span>${safe(e.name)}</span><span class="muted tiny">${e.sets} × ${e.reps}</span></div>`).join('')}<button class="btn full" style="margin-top:12px" data-start="${safe(p.id)}">Training starten</button></div>`).join(''):'<div class="card empty">Noch keine Pläne. Erstelle deinen ersten Trainingsplan.</div>'}`}
function editView(){const p=db.plans.find(p=>p.id===editPlan);if(!p){editPlan=null;return plansView()}return `<button class="btn ghost small" id="backPlans">← Zurück</button><div class="card" style="margin-top:12px"><h2>Plan bearbeiten</h2><label class="label">Name des Trainingsplans</label><input id="planName" maxlength="60" value="${safe(p.name)}"><div class="line"></div><h3>Übungen</h3>${p.exercises.map((e,i)=>`<div class="exercise"><div class="row between"><b>${safe(e.name)}</b><button class="btn danger small" data-remove-ex="${safe(e.id)}">Löschen</button></div><div class="grid2"><label class="label">Sätze<input type="number" min="1" max="20" value="${e.sets}" data-ex-field="sets" data-ex-id="${safe(e.id)}"></label><label class="label">Wiederholungen<input type="number" min="1" max="100" value="${e.reps}" data-ex-field="reps" data-ex-id="${safe(e.id)}"></label></div></div>`).join('')}<label class="label">Neue Übung</label><div class="row"><input id="newExName" maxlength="60" placeholder="z. B. Schulterdrücken"><button class="btn" id="addExercise">+</button></div><div class="line"></div><div class="row wrap"><button class="btn" id="savePlan">Speichern</button><button class="btn danger" id="deletePlan">Plan löschen</button></div></div>`}
function trainView(){if(!active)return `<h2>Training</h2><div class="card"><h3>Wähle deinen Trainingsplan</h3>${db.plans.length?db.plans.map(p=>`<button class="btn secondary full" style="margin:5px 0;text-align:left" data-start="${safe(p.id)}">${safe(p.name)} · ${p.exercises.length} Übungen →</button>`).join(''):'<p class="muted">Erstelle zuerst einen Trainingsplan.</p>'}</div>${timerView()}`;return `<div class="row between"><div><div class="eyebrow">Aktive Einheit</div><h2>${safe(active.planName)}</h2></div><button class="btn ghost small" id="discard">Abbrechen</button></div><div class="card"><label class="label">Trainingsdatum</label><input type="date" id="sessionDate" value="${safe(active.date)}"></div>${active.exercises.map((e,i)=>`<div class="card"><div class="row between"><h3>${safe(e.name)}</h3><span class="pill">${e.sets.filter(s=>s.done).length}/${e.sets.length} Sätze</span></div><div class="setrow muted tiny"><span>Satz</span><span>kg</span><span>Wdh.</span><span>✓</span></div>${e.sets.map((s,j)=>`<div class="setrow"><b>${j+1}</b><input aria-label="Gewicht Satz ${j+1}" type="number" min="0" max="2000" step="0.5" data-weight="${i},${j}" value="${s.weight}"><input aria-label="Wiederholungen Satz ${j+1}" type="number" min="0" max="200" data-reps="${i},${j}" value="${s.reps}"><button class="check ${s.done?'done':''}" data-done="${i},${j}">${s.done?'✓':'○'}</button></div>`).join('')}<button class="btn ghost small" data-addset="${i}">+ Satz hinzufügen</button></div>`).join('')}${timerView()}<button class="btn full" id="finish">Training speichern ✓</button><p class="muted tiny">Nur abgehakte Sätze werden im Fortschrittsdiagramm berücksichtigt.</p>`}
function timerView(){return `<div class="card"><div class="row between"><h3>Pausentimer</h3><span class="pill">Sekunden</span></div><div class="timer" id="clock">${clock(timerRemaining)}</div><div class="row wrap" style="justify-content:center"><button class="btn ghost small" data-timer-set="60">1:00</button><button class="btn ghost small" data-timer-set="90">1:30</button><button class="btn ghost small" data-timer-set="120">2:00</button><button class="btn" id="timerToggle">${timerRunning?'Pause':'Start'}</button><button class="btn secondary" id="timerReset">Reset</button></div></div>`}
function clock(n){n=Math.max(0,Math.ceil(n));return `${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`}
function progressView(){let names=[...new Set(db.sessions.flatMap(s=>s.exercises.map(e=>e.name)))].sort((a,b)=>a.localeCompare(b,'de'));if(!names.includes(progressExercise))progressExercise=names[0]||'';let points=db.sessions.flatMap(s=>s.exercises.filter(e=>e.name===progressExercise).map(e=>({date:s.date,max:Math.max(0,...e.sets.filter(x=>x.done).map(x=>Number(x.weight)||0))}))).filter(p=>p.max>0).sort((a,b)=>a.date.localeCompare(b.date));let svg='';if(points.length){let max=Math.max(...points.map(p=>p.max)),min=Math.min(0,...points.map(p=>p.max));let xy=points.map((p,i)=>[45+(points.length===1?125:i*250/(points.length-1)),170-(p.max-min)/Math.max(1,max-min)*130]);svg=`<svg class="chart" viewBox="0 0 340 205" role="img" aria-label="Gewichtsverlauf"><line x1="45" y1="170" x2="310" y2="170" stroke="#dbe3ef"/><line x1="45" y1="35" x2="45" y2="170" stroke="#dbe3ef"/><text x="5" y="40" font-size="11" fill="#748097">${max} kg</text><text x="14" y="170" font-size="11" fill="#748097">0</text><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#3568ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#3568ee"><title>${safe(points[i].date)}: ${points[i].max} kg</title></circle>`).join('')}<text x="45" y="194" font-size="11" fill="#748097">${dateLabel(points[0].date)}</text><text x="310" y="194" font-size="11" text-anchor="end" fill="#748097">${dateLabel(points.at(-1).date)}</text></svg>`}return `<h2>Fortschritt</h2><div class="card"><h3>Maximales Trainingsgewicht</h3><label class="label">Übung auswählen</label><select id="progressSelect">${names.map(n=>`<option ${n===progressExercise?'selected':''} value="${safe(n)}">${safe(n)}</option>`).join('')}</select>${points.length?`${svg}<p class="muted tiny">Höchstes Gewicht eines abgeschlossenen Satzes pro Einheit. Mehrere Einheiten am selben Tag werden einzeln dargestellt.</p><div class="stat">Aktueller Wert <b>${points.at(-1).max} kg</b></div>`:'<div class="empty">Sobald du ein Training mit abgehakten Sätzen und Gewichten speicherst, erscheint hier dein Diagramm.</div>'}</div><div class="card"><h3>Trainingseinheiten</h3>${db.sessions.length?db.sessions.slice().reverse().slice(0,8).map(s=>`<div class="row between" style="padding:9px 0;border-bottom:1px solid #edf0f5"><b>${safe(s.planName)}</b><span class="muted tiny">${dateLabel(s.date)}</span></div>`).join(''):'<p class="muted">Noch keine Einheiten gespeichert.</p>'}</div>`}
function calendarView(){let first=new Date(year,month,1),offset=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),cells=[];for(let i=0;i<42;i++){let day=i-offset+1,d=new Date(year,month,day),iso=localDate(d),cnt=db.sessions.filter(s=>s.date===iso).length;cells.push(`<button class="day ${d.getMonth()!==month?'out':''} ${cnt?'training':''} ${selectedDay===iso?'selected':''}" data-day="${iso}">${d.getDate()}</button>`)}let found=db.sessions.filter(s=>s.date===selectedDay);return `<h2>Trainingskalender</h2><div class="card"><div class="row between"><button class="btn ghost small" id="prevMonth">←</button><h3 style="margin:0">${first.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</h3><button class="btn ghost small" id="nextMonth">→</button></div><div class="calendar">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div><p class="muted tiny">Blaue Punkte markieren Tage mit Training.</p></div><div class="card"><h3>${dateLabel(selectedDay)}</h3>${found.length?found.map(s=>`<div class="exercise"><div class="row between"><div><b>${safe(s.planName)}</b><span class="muted tiny">${s.exercises.length} Übungen · ${s.exercises.reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0)} abgeschlossene Sätze</span></div><button class="btn danger small" data-delete-session="${safe(s.id)}">Löschen</button></div>${s.exercises.map(e=>`<div class="muted tiny" style="margin-top:6px">${safe(e.name)}: ${e.sets.filter(x=>x.done).map(x=>`${x.weight} kg × ${x.reps}`).join(', ')||'keine Sätze abgehakt'}</div>`).join('')}</div>`).join(''):'<p class="muted">An diesem Tag ist kein Training gespeichert.</p>'}</div>`}
function startPlan(id){if(active&&!confirm('Aktuelles, ungespeichertes Training verwerfen?'))return;const p=db.plans.find(p=>p.id===id);if(!p)return;active={id:uid(),date:today(),planName:p.name,exercises:p.exercises.map(e=>({id:e.id,name:e.name,sets:Array.from({length:e.sets},()=>({weight:0,reps:e.reps,done:false}))}))};tab='train';render()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navTo(b.dataset.go));document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startPlan(b.dataset.start));document.getElementById('newPlan')?.addEventListener('click',()=>{let name=prompt('Name des neuen Trainingsplans:','Mein Trainingsplan');if(!name?.trim())return;let p={id:uid(),name:name.trim().slice(0,60),exercises:[]};db.plans.push(p);save();editPlan=p.id;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editPlan=b.dataset.edit;render()});document.getElementById('backPlans')?.addEventListener('click',()=>{editPlan=null;render()});document.getElementById('savePlan')?.addEventListener('click',()=>{let p=db.plans.find(p=>p.id===editPlan);p.name=document.getElementById('planName').value.trim()||'Unbenannter Plan';save();editPlan=null;toast('Plan gespeichert');render()});document.getElementById('deletePlan')?.addEventListener('click',()=>{if(!confirm('Diesen Plan endgültig löschen?'))return;db.plans=db.plans.filter(p=>p.id!==editPlan);save();editPlan=null;render()});document.getElementById('addExercise')?.addEventListener('click',()=>{let input=document.getElementById('newExName');let name=input.value.trim();if(!name)return;db.plans.find(p=>p.id===editPlan).exercises.push({id:uid(),name,sets:3,reps:10});save();render()});document.getElementById('newExName')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addExercise').click()});document.querySelectorAll('[data-remove-ex]').forEach(b=>b.onclick=()=>{let p=db.plans.find(p=>p.id===editPlan);p.exercises=p.exercises.filter(e=>e.id!==b.dataset.removeEx);save();render()});document.querySelectorAll('[data-ex-field]').forEach(el=>el.onchange=()=>{let p=db.plans.find(p=>p.id===editPlan),e=p.exercises.find(e=>e.id===el.dataset.exId);e[el.dataset.exField]=Math.max(1,Math.min(el.dataset.exField==='sets'?20:100,Math.round(Number(el.value)||1)));save()});document.getElementById('sessionDate')?.addEventListener('change',e=>{active.date=e.target.value||today()});document.querySelectorAll('[data-weight]').forEach(el=>el.onchange=()=>{let [i,j]=el.dataset.weight.split(',').map(Number);active.exercises[i].sets[j].weight=Math.max(0,Math.min(2000,Number(el.value)||0))});document.querySelectorAll('[data-reps]').forEach(el=>el.onchange=()=>{let [i,j]=el.dataset.reps.split(',').map(Number);active.exercises[i].sets[j].reps=Math.max(0,Math.min(200,Math.round(Number(el.value)||0)))});document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.done.split(',').map(Number);active.exercises[i].sets[j].done=!active.exercises[i].sets[j].done;render()});document.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{let e=active.exercises[Number(b.dataset.addset)];e.sets.push({weight:e.sets.at(-1)?.weight||0,reps:e.sets.at(-1)?.reps||10,done:false});render()});document.getElementById('finish')?.addEventListener('click',()=>{if(!active.exercises.length){toast('Füge zuerst Übungen hinzu');return}if(!active.exercises.some(e=>e.sets.some(s=>s.done))&&!confirm('Keine Sätze abgehakt. Trotzdem speichern?'))return;db.sessions.push(structuredClone(active));db.sessions.sort((a,b)=>a.date.localeCompare(b.date));save();active=null;toast('Training gespeichert');tab='calendar';selectedDay=db.sessions.at(-1).date;month=Number(selectedDay.slice(5,7))-1;year=Number(selectedDay.slice(0,4));render()});document.getElementById('discard')?.addEventListener('click',()=>{if(confirm('Ungespeichertes Training verwerfen?')){active=null;render()}});document.querySelectorAll('[data-timer-set]').forEach(b=>b.onclick=()=>{timerRunning=false;timerRemaining=Number(b.dataset.timerSet);render()});document.getElementById('timerToggle')?.addEventListener('click',()=>{if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerUntil-Date.now())/1000));timerRunning=false}else{if(timerRemaining<=0)timerRemaining=90;timerUntil=Date.now()+timerRemaining*1000;timerRunning=true}render()});document.getElementById('timerReset')?.addEventListener('click',()=>{timerRunning=false;timerRemaining=90;render()});document.getElementById('progressSelect')?.addEventListener('change',e=>{progressExercise=e.target.value;render()});document.getElementById('prevMonth')?.addEventListener('click',()=>{month--;if(month<0){month=11;year--}render()});document.getElementById('nextMonth')?.addEventListener('click',()=>{month++;if(month>11){month=0;year++}render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.day;render()});document.querySelectorAll('[data-delete-session]').forEach(b=>b.onclick=()=>{if(!confirm('Trainingseinheit endgültig löschen?'))return;db.sessions=db.sessions.filter(s=>s.id!==b.dataset.deleteSession);save();render()})}
setInterval(()=>{if(!timerRunning)return;timerRemaining=Math.max(0,Math.ceil((timerUntil-Date.now())/1000));const el=document.getElementById('clock');if(el)el.textContent=clock(timerRemaining);if(timerRemaining===0){timerRunning=false;toast('Pause vorbei!');if(navigator.vibrate)navigator.vibrate([200,100,200]);let toggle=document.getElementById('timerToggle');if(toggle)toggle.textContent='Start'}},250);
document.getElementById('backupBtn').onclick=()=>{let option=prompt('Datensicherung: 1 = Exportieren, 2 = Importieren','1');if(option==='1'){let blob=new Blob([JSON.stringify({format:'kraftlog-2',exportedAt:new Date().toISOString(),...db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kraftlog-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}else if(option==='2'){document.getElementById('importFile').click()}};
document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!valid(x))throw Error('Ungültiges Format');if(!confirm('Aktuelle Pläne und Trainings durch die importierten Daten ersetzen?'))return;db={plans:x.plans,sessions:x.sessions};save();active=null;render();toast('Daten importiert')}catch{alert('Die Datei ist kein gültiges KraftLog-Backup.')}finally{e.target.value=''}};
render();
</script></body></html>
